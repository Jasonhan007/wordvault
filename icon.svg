<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#5CA6FF"/>
      <stop offset="0.38" stop-color="#2F6DFF"/>
      <stop offset="0.7" stop-color="#6B4DFF"/>
      <stop offset="1" stop-color="#B45CFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BFE4FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#BFE4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFA9F0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFA9F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8BFFE4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8BFFE4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="letterShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2A80" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B2A80" flood-opacity="0.28"/>
    </filter>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="118"/>
    </clipPath>
  </defs>

  <!-- 底：蓝紫液态渐变 -->
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="104" cy="66" r="230" fill="url(#blobA)" filter="url(#soft)"/>
    <circle cx="438" cy="128" r="210" fill="url(#blobB)" filter="url(#soft)"/>
    <circle cx="300" cy="520" r="220" fill="url(#blobC)" filter="url(#soft)"/>
    <rect width="512" height="300" fill="url(#gloss)"/>

    <!-- 玻璃卡片：薄薄一层，承载字母 -->
    <rect x="96" y="96" width="320" height="320" rx="86" fill="url(#glass)"
          stroke="url(#edge)" stroke-width="2.5" filter="url(#cardShadow)"/>
    <rect x="104" y="104" width="304" height="304" rx="79" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>

    <!-- 字母 W：圆头笔画，居中呼吸 -->
    <path d="M176 202 L216 314 L256 240 L296 314 L336 202"
          fill="none" stroke="#FFFFFF" stroke-width="39"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#letterShadow)"/>
    <path d="M176 202 L216 314 L256 240 L296 314 L336 202"
          fill="none" stroke="#FFFFFF" stroke-width="39"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 顶部高光边：模拟玻璃反光 -->
    <rect x="1.5" y="1.5" width="509" height="509" rx="116.5"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3"/>
  </g>
</svg>
